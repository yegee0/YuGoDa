# Server
server.port=${SERVER_PORT:4000}

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yugoda}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable Spring Boot auto schema/data scripts (we handle init in code)
spring.sql.init.mode=never

# Allow large JSON request bodies (needed for base64 image uploads in store/profile)
server.tomcat.max-http-form-post-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# CORS (override via env — comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://frontend-service-ey66bgcneq-ew.a.run.app,https://yugoda.net,https://www.yugoda.net}

# Firebase Admin SDK
# Option A (preferred): paste the entire service account JSON as one line in FIREBASE_SERVICE_ACCOUNT_KEY
# Option B (fallback):  set FIREBASE_SERVICE_ACCOUNT_PATH to the path of the JSON file
# If neither is set, falls back to GCP Application Default Credentials (works on Cloud Run).
firebase.service-account-key=${FIREBASE_SERVICE_ACCOUNT_KEY:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:yugoda-5b36a}

# iyzico
iyzico.api-key=${IYZICO_API_KEY:dummy}
iyzico.secret-key=${IYZICO_SECRET_KEY:dummy}
iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}

# App URL (for payment callback)
app.url=${APP_URL:http://localhost:4000}

# Disable Whitelabel Error Page
server.error.whitelabel.enabled=false

# Ollama (local LLM)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model-name=${OLLAMA_MODEL:gemma4}
ollama.timeout=${OLLAMA_TIMEOUT:120}

# Logging
logging.level.yugoda=INFO
logging.level.org.hibernate.SQL=WARN
